  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

60px\">\n      <h1 style=\"margin:0;font-size:84px;line-height:.98;font-weight:700;letter-spacing:-.045em\">Falcon 2.0<\u002Fh1>\n      <p style=\"margin:0;font-size:22px;line-height:1.5;color:#CFE1DB;max-width:720px;text-wrap:pretty\">The design system behind Hala Business, the banking and payments app for Saudi companies. It covers web and mobile in English and Arabic, from the brand foundations to complete flows.<\u002Fp>\n      <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-top:8px\"><a href=\"Hala Foundations.dc.html\" style=\"height:48px;padding:0 22px;border-radius:999px;background:linear-gradient(90deg,#0A7559,#2C957A);color:#FFFFFF;font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:0 10px 22px -12px rgba(10,117,89,.9)\">Start with foundations →<\u002Fa><a href=\"#components\" style=\"height:48px;padding:0 22px;border-radius:999px;border:1px solid rgba(255,255,255,.22);color:#FFFFFF;font-size:15px;font-weight:500;display:flex;align-items:center\">Browse components<\u002Fa><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;border-radius:20px;overflow:hidden;background:rgba(255,255,255,.1)\">\n      <sc-for list=\"{{ stats }}\" as=\"s\" hint-placeholder-count=\"5\"><div style=\"background:#0F2620;padding:20px 22px;display:flex;flex-direction:column;gap:4px\"><span style=\"font:600 34px 'IBM Plex Mono',monospace;letter-spacing:-.02em;color:#FFFFFF\">{{ s.n }}<\u002Fspan><span style=\"font-size:13.5px;color:#A9B8B3\">{{ s.l }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"max-width:1240px;margin:0 auto;padding:88px 32px 56px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:48px;align-items:start\">\n  <div style=\"display:flex;flex-direction:column;gap:12px;position:sticky;top:24px\"><span style=\"font:500 12px 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#0B8F6E\">01 · WHAT IT IS<\u002Fspan><h2 style=\"margin:0;font-size:36px;font-weight:700;letter-spacing:-.025em;line-height:1.15\">One system, two platforms, two languages.<\u002Fh2><\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:18px;font-size:17px;line-height:1.65;color:#2E403B\">\n    <p style=\"margin:0\">Falcon 2.0 is the shared language for everyone building Hala Business: designers, engineers, product and content. It sets out how the product looks, how it behaves and how it speaks, so that a transfer, a card or a POS order works the same way on the web dashboard, on iOS and on Android.<\u002Fp>\n    <p style=\"margin:0\">Each component page shows every state, live examples you can use, mobile versions, and rules for when to use it and when not to. The values on those pages (colors, type, spacing, radius, shadows, motion) come from one set of tokens defined in Foundations.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:6px\">\n      <sc-for list=\"{{ covers }}\" as=\"c\" hint-placeholder-count=\"4\"><div style=\"background:#FFFFFF;border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:4px\"><span style=\"font-size:15px;font-weight:600\">{{ c.k }}<\u002Fspan><span style=\"font-size:13.5px;line-height:1.5;color:#5E7770\">{{ c.v }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"max-width:1240px;margin:0 auto;padding:32px 32px 56px;display:flex;flex-direction:column;gap:28px\">\n  <div style=\"display:flex;flex-direction:column;gap:12px;max-width:760px\"><span style=\"font:500 12px 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#0B8F6E\">02 · PRINCIPLES<\u002Fspan><h2 style=\"margin:0;font-size:36px;font-weight:700;letter-spacing:-.025em;line-height:1.15\">What every screen should do<\u002Fh2><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px\">\n    <sc-for list=\"{{ principles }}\" as=\"p\" hint-placeholder-count=\"6\"><div style=\"background:#FFFFFF;border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:12px;min-height:220px\"><span style=\"font:600 13px 'IBM Plex Mono',monospace;color:#0B8F6E\">{{ p.n }}<\u002Fspan><span style=\"font-size:20px;font-weight:700;letter-spacing:-.01em\">{{ p.k }}<\u002Fspan><span style=\"font-size:14.5px;line-height:1.6;color:#4A615A\">{{ p.v }}<\u002Fspan><span style=\"margin-top:auto;font:400 12.5px 'IBM Plex Mono',monospace;color:#5E7770;padding-top:12px;border-top:1px solid #EEF2F0\">{{ p.e }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"max-width:1240px;margin:0 auto;padding:32px 32px 56px;display:flex;flex-direction:column;gap:28px\">\n  <div style=\"display:flex;flex-direction:column;gap:12px;max-width:760px\"><span style=\"font:500 12px 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#0B8F6E\">03 · FOUNDATIONS AT A GLANCE<\u002Fspan><h2 style=\"margin:0;font-size:36px;font-weight:700;letter-spacing:-.025em;line-height:1.15\">The building blocks<\u002Fh2><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px\">\n    <a href=\"Hala Foundations.dc.html#color\" style=\"background:#FFFFFF;border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:16px;color:#0C1F1A\" style-hover=\"box-shadow:0 18px 40px -22px rgba(12,31,26,.35)\">\n      <div style=\"display:flex;justify-content:space-between;align-items:baseline\"><span style=\"font-size:18px;font-weight:700\">Color<\u002Fspan><span style=\"font-size:13px;color:#0E7C62;font-weight:600\">Open →<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:6px;height:120px\"><span style=\"border-radius:14px;background:#009A78;display:flex;align-items:flex-end;padding:10px;font:500 11px 'IBM Plex Mono',monospace;color:#FFFFFF\">Hala green<\u002Fspan><span style=\"border-radius:14px;background:#0C1F1A\"><\u002Fspan><span style=\"border-radius:14px;background:#EEF3F1;border:1px solid #E1E8E5\"><\u002Fspan><span style=\"border-radius:14px;background:#E3F6EF\"><\u002Fspan><span style=\"border-radius:14px;background:#9DD3C2\"><\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;gap:6px\"><span style=\"flex:1;height:10px;border-radius:5px;background:#0B8F6E\"><\u002Fspan><span style=\"flex:1;height:10px;border-radius:5px;background:#B45309\"><\u002Fspan><span style=\"flex:1;height:10px;border-radius:5px;background:#E02424\"><\u002Fspan><span style=\"flex:1;height:10px;border-radius:5px;background:#2F5BD3\"><\u002Fspan><span style=\"flex:1;height:10px;border-radius:5px;background:#6D4CD3\"><\u002Fspan><\u002Fdiv>\n      <span style=\"font-size:13.5px;color:#5E7770\">Brand, ink, surfaces, borders, status and chart colors, with contrast checked.<\u002Fspan>\n    <\u002Fa>\n    <a href=\"Hala Foundations.dc.html#type\" style=\"background:#FFFFFF;border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:14px;color:#0C1F1A\" style-hover=\"box-shadow:0 18px 40px -22px rgba(12,31,26,.35)\">\n      <div style=\"display:flex;justify-content:space-between;align-items:baseline\"><span style=\"font-size:18px;font-weight:700\">Typography<\u002Fspan><span style=\"font-size:13px;color:#0E7C62;font-weight:600\">Open →<\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;align-items:baseline;gap:18px;flex-wrap:wrap\"><span style=\"font-size:56px;font-weight:600;line-height:1\">Aa<\u002Fspan><span style=\"font:600 44px 'IBM Plex Mono',monospace;line-height:1\">01<\u002Fspan><span style=\"font-family:'IBM Plex Sans Arabic',sans-serif;font-size:50px;font-weight:600;line-height:1\">أب<\u002Fspan><\u002Fdiv>\n      <span style=\"font:500 15px 'IBM Plex Mono',monospace\">SAR 175,000.00<\u002Fspan>\n      <span style=\"font-size:13.5px;color:#5E7770\">IBM Plex Sans, Plex Mono for numbers, Plex Sans Arabic.<\u002Fspan>\n    <\u002Fa>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px\">\n    <sc-for list=\"{{ found }}\" as=\"f\" hint-placeholder-count=\"6\"><a href=\"{{ f.href }}\" style=\"background:#FFFFFF;border-radius:20px;padding:18px 20px;display:flex;flex-direction:column;gap:6px;color:#0C1F1A\" style-hover=\"box-shadow:0 18px 40px -22px rgba(12,31,26,.35)\"><span style=\"font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.12em;color:#5E7770\">{{ f.tag }}<\u002Fspan><span style=\"font-size:16px;font-weight:600\">{{ f.k }}<\u002Fspan><span style=\"font-size:13px;line-height:1.5;color:#5E7770\">{{ f.v }}<\u002Fspan><\u002Fa><\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"components\" style=\"max-width:1240px;margin:0 auto;padding:32px 32px 56px;display:flex;flex-direction:column;gap:28px\">\n  <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap\"><div style=\"display:flex;flex-direction:column;gap:12px;max-width:760px\"><span style=\"font:500 12px 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#0B8F6E\">04 · COMPONENTS<\u002Fspan><h2 style=\"margin:0;font-size:36px;font-weight:700;letter-spacing:-.025em;line-height:1.15\">Library<\u002Fh2><\u002Fdiv><span style=\"font-size:14px;color:#5E7770\">Every page has states, live demos, web and mobile versions, and rules.<\u002Fspan><\u002Fdiv>\n  <sc-for list=\"{{ groups }}\" as=\"g\" hint-placeholder-count=\"5\">\n    <div style=\"display:flex;flex-direction:column;gap:10px\">\n      <span style=\"font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.12em;color:#6B827B\">{{ g.k }}<\u002Fspan>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px\">\n        <sc-for list=\"{{ g.items }}\" as=\"i\" hint-placeholder-count=\"4\"><a href=\"{{ i.href }}\" style=\"background:#FFFFFF;border-radius:18px;padding:16px 18px;display:flex;align-items:center;gap:14px;color:#0C1F1A\" style-hover=\"box-shadow:0 14px 30px -18px rgba(12,31,26,.35)\"><span style=\"width:40px;height:40px;border-radius:12px;background:#F2F6F4;display:flex;align-items:center;justify-content:center;flex:none\"><svg sc-camel-view-box=\"0 0 24 24\" style=\"width:20px;height:20px\" fill=\"none\" stroke=\"#0C1F1A\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"{{ i.icon }}\"><\u002Fpath><\u002Fsvg><\u002Fspan><div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:1px\"><span style=\"font-size:15px;font-weight:600\">{{ i.k }}<\u002Fspan><span style=\"font-size:12.5px;color:#5E7770;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ i.v }}<\u002Fspan><\u002Fdiv><span style=\"color:#9AACA6;font-size:16px\">→<\u002Fspan><\u002Fa><\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-for>\n<\u002Fsection>\n\n<section style=\"max-width:1240px;margin:0 auto;padding:32px 32px 56px;display:flex;flex-direction:column;gap:28px\">\n  <div style=\"display:flex;flex-direction:column;gap:12px;max-width:760px\"><span style=\"font:500 12px 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#0B8F6E\">05 · HOW TO USE IT<\u002Fspan><h2 style=\"margin:0;font-size:36px;font-weight:700;letter-spacing:-.025em;line-height:1.15\">Getting started<\u002Fh2><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px\">\n    <sc-for list=\"{{ roles }}\" as=\"r\" hint-placeholder-count=\"3\"><div style=\"background:#FFFFFF;border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:14px\"><span style=\"font-size:20px;font-weight:700\">{{ r.k }}<\u002Fspan><sc-for list=\"{{ r.steps }}\" as=\"s\" hint-placeholder-count=\"4\"><div style=\"display:flex;gap:12px;align-items:flex-start\"><span style=\"width:24px;height:24px;border-radius:50%;background:#E3F6EF;color:#0B6F56;font:600 11.5px 'IBM Plex Mono',monospace;display:flex;align-items:center;justify-content:center;flex:none\">{{ s.n }}<\u002Fspan><span style=\"font-size:14.5px;line-height:1.55\">{{ s.t }}<\u002Fspan><\u002Fdiv><\u002Fsc-for><\u002Fdiv><\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"background:#0C1F1A;border-radius:24px;padding:24px 28px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:28px;color:#FFFFFF;align-items:center\">\n    <div style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font-size:20px;font-weight:700\">Naming<\u002Fspan><span style=\"font-size:14.5px;line-height:1.6;color:#CFE1DB\">Tokens are named by role, not by value, so they can change without breaking anything. Components use the same names in Figma and in code.<\u002Fspan><\u002Fdiv>\n    <pre style=\"margin:0;border-radius:14px;background:#0F2620;padding:16px 18px;font:400 13px/1.8 'IBM Plex Mono',monospace;color:#CFEDE3;white-space:pre-wrap;word-break:break-word\">brand/600        #0B8F6E   selected, toggles\ntext/secondary   #4A615A   descriptions\nsurface/canvas   #EEF3F1   page background\nradius/xl        20px      cards, modals\nshadow/2         floating  menus, toasts\nmotion/standard  240ms     drawers, toggles<\u002Fpre>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"max-width:1240px;margin:0 auto;padding:32px 32px 56px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px\">\n  <div style=\"background:#FFFFFF;border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:14px\">\n    <span style=\"font:500 12px 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#0B8F6E\">06 · WHAT'S NEW IN 2.0<\u002Fspan>\n    <sc-for list=\"{{ news }}\" as=\"n\" hint-placeholder-count=\"6\"><div style=\"display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-top:1px solid {{ n.bdr }}\"><span style=\"height:22px;padding:0 8px;border-radius:999px;background:{{ n.bg }};color:{{ n.fg }};font:500 10.5px 'IBM Plex Mono',monospace;letter-spacing:.08em;display:flex;align-items:center;flex:none\">{{ n.tag }}<\u002Fspan><span style=\"font-size:14px;line-height:1.5\">{{ n.t }}<\u002Fspan><\u002Fdiv><\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"background:#FFFFFF;border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:14px\">\n    <span style=\"font:500 12px 'IBM Plex Mono',monospace;letter-spacing:.14em;color:#0B8F6E\">07 · REFERENCE SCREENS<\u002Fspan>\n    <sc-for list=\"{{ refs }}\" as=\"r\" hint-placeholder-count=\"5\"><a href=\"{{ r.href }}\" style=\"display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid {{ r.bdr }};color:#0C1F1A\"><div style=\"display:flex;flex-direction:column;gap:2px\"><span style=\"font-size:15px;font-weight:600\">{{ r.k }}<\u002Fspan><span style=\"font-size:13px;color:#5E7770\">{{ r.v }}<\u002Fspan><\u002Fdiv><span style=\"color:#0E7C62;font-size:16px\">→<\u002Fspan><\u002Fa><\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"max-width:1240px;margin:0 auto;padding:24px 32px 64px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border-top:1px solid #DDE6E2\">\n  <div style=\"display:flex;align-items:center;gap:10px\"><img src=\"fad99150-f8f9-488f-885a-b855da39c3a2\" alt=\"\" style=\"width:24px;height:24px\"><span style=\"font-size:14px;font-weight:600\">Falcon 2.0<\u002Fspan><span style=\"font-size:13.5px;color:#5E7770\">· Hala design system<\u002Fspan><\u002Fdiv>\n  <span style=\"font-size:13px;color:#5E7770\">Questions or a component you need? Ask the design team in #falcon-design.<\u002Fspan>\n<\u002Ffooter><\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  renderVals() {\n    const stats = [['26', 'documented pages'], ['30+', 'components'], ['2', 'platforms · web, iOS/Android'], ['2', 'languages · EN, AR'], ['85', 'approved icons']].map(([n, l]) => ({ n, l }));\n    const covers = [['Foundations', 'Color, type, spacing, radius, elevation, motion, icons, illustrations, logo.'], ['Components', 'From buttons to tables, each with every state, web and mobile versions, and rules.'], ['Patterns', 'How components combine: filters, flows, confirmations, dashboards.'], ['Screens', 'Moodboards and reference screens for web and mobile.']].map(([k, v]) => ({ k, v }));\n    const principles = [\n      ['01', 'Money first, always clear', 'Balances, amounts and statuses are the most important content. Numbers use Plex Mono, have a sign and two decimals, and are never decorated.', '− 25,000.00 · Pending'],\n      ['02', 'One main action', 'Each screen has one gradient button. Everything else is secondary, so the next step is always obvious.', 'Send SAR 25,000'],\n      ['03', 'Calm by default', 'White cards on a mint-gray background. Color is used only for status, data and the brand mark, never for decoration.', '#EEF3F1 · #FFFFFF'],\n      ['04', 'Say what happens', 'Buttons are verbs, errors say how to fix them, and anything that moves money shows what happens next.', '\"Arrives the next business day\"'],\n      ['05', 'Built for Saudi business', 'Arabic and English are equally important. The layout mirrors for right-to-left, the week starts on Sunday, banks close Friday and Saturday, and VAT is always shown.', 'RTL · SAR · 15% VAT'],\n      ['06', 'Same on every screen', 'One set of tokens and one component library. Web follows desktop patterns and mobile follows iOS and Android, but they look and read the same.', 'Web · iOS · Android']\n    ].map(([n, k, v, e]) => ({ n, k, v, e }));\n    const found = [['SPACING', 'Spacing and layout', '4 px base, 11 steps, 12-column grid, breakpoints.', 'Hala Foundations.dc.html#space'], ['SHAPE', 'Radius and elevation', 'Soft corners, pill buttons, tinted shadows.', 'Hala Foundations.dc.html#radius'], ['MOTION', 'Motion', 'One curve, five durations, reduced motion.', 'Hala Foundations.dc.html#motion'], ['BRAND', 'Logo', 'Wordmark, symbol, app icons, favicons.', 'Hala Logo.dc.html'], ['ICONS', 'Icons', 'Lucide at 1.7 stroke, 85 approved icons.'
